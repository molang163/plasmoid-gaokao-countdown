<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">高考倒计时 Plasma 6 小组件预览</title>
  <desc id="desc">KDE Plasma 6 桌面上的高考倒计时小组件，包含桌面完整视图和面板紧凑视图。</desc>
  <defs>
    <linearGradient id="wallpaper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.45" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#f6f2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#1d99f3"/>
      <stop offset="1" stop-color="#7f52ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#1d3557" flood-opacity="0.18"/>
    </filter>
    <filter id="panelShadow" x="-10%" y="-50%" width="120%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1d3557" flood-opacity="0.18"/>
    </filter>
    <style>
      text {
        font-family: "Noto Sans CJK SC", "Noto Sans SC", "Inter", "Segoe UI", sans-serif;
        fill: #1f2937;
      }
      .muted { fill: #6b7280; }
      .small { font-size: 20px; }
      .body { font-size: 25px; }
      .title { font-size: 32px; font-weight: 700; }
      .number { font-size: 150px; font-weight: 800; letter-spacing: 0; }
      .unit { font-size: 48px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#wallpaper)"/>
  <circle cx="1020" cy="124" r="190" fill="#dff2ff" opacity="0.55"/>
  <circle cx="130" cy="148" r="140" fill="#efe7ff" opacity="0.62"/>
  <path d="M0 612 C205 548 311 660 506 590 C705 519 846 604 1200 520 L1200 760 L0 760 Z" fill="#ffffff" opacity="0.42"/>

  <text x="92" y="86" class="small muted">KDE Plasma 6 Widget</text>
  <text x="92" y="125" font-size="42" font-weight="800">Gaokao Countdown</text>
  <text x="92" y="162" class="body muted">桌面完整视图 + 面板紧凑视图</text>

  <g filter="url(#shadow)">
    <rect x="300" y="176" width="600" height="350" rx="28" fill="url(#card)" stroke="#d8e2ef"/>
    <g transform="translate(342 218)">
      <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#accent)"/>
      <rect x="12" y="15" width="26" height="24" rx="4" fill="#ffffff" opacity="0.96"/>
      <rect x="12" y="20" width="26" height="3" fill="#1d99f3" opacity="0.65"/>
      <rect x="17" y="10" width="5" height="11" rx="2" fill="#ffffff"/>
      <rect x="28" y="10" width="5" height="11" rx="2" fill="#ffffff"/>
    </g>
    <text x="410" y="246" class="title">高考倒计时</text>
    <text x="410" y="279" class="small muted">2026年6月7日 09:00</text>

    <text x="432" y="405" class="number" fill="#1d99f3">44</text>
    <text x="668" y="384" class="unit" fill="#1d99f3">天</text>
    <text x="668" y="426" class="body">44天 9时 12分 03秒</text>

    <rect x="352" y="459" width="496" height="10" rx="5" fill="#dde7f2"/>
    <rect x="352" y="459" width="436" height="10" rx="5" fill="url(#accent)"/>
    <text x="352" y="500" class="small muted">距离目标日期还剩 44 天</text>
    <text x="815" y="500" class="small muted" text-anchor="end">88%</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="80" y="642" width="1040" height="58" rx="22" fill="#fbfdff" stroke="#d6e1ec"/>
    <circle cx="121" cy="671" r="12" fill="#1d99f3"/>
    <circle cx="161" cy="671" r="12" fill="#3dae2b"/>
    <circle cx="201" cy="671" r="12" fill="#7f52ff"/>
    <rect x="505" y="653" width="190" height="36" rx="18" fill="#edf6ff" stroke="#c7ddf2"/>
    <g transform="translate(527 662)">
      <rect x="0" y="0" width="18" height="18" rx="5" fill="#1d99f3"/>
      <rect x="4" y="6" width="10" height="8" rx="2" fill="#ffffff"/>
      <rect x="4" y="8" width="10" height="1.5" fill="#1d99f3" opacity="0.5"/>
    </g>
    <text x="556" y="678" class="label">44天</text>
    <text x="1050" y="678" class="small muted" text-anchor="end">23:10</text>
  </g>
</svg>
